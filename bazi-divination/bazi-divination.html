<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八字解读 - 周易八卦解卦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #e0c068;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #a0a0a0;
        }
        
        .form-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #e0c068;
            font-weight: bold;
        }
        
        .input-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        select, input {
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: #e0e0e0;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #e0c068;
            box-shadow: 0 0 10px rgba(224, 192, 104, 0.3);
        }
        
        select option {
            background: #16213e;
            color: #e0e0e0;
        }
        
        .btn {
            background: linear-gradient(135deg, #e0c068, #c9a04f);
            color: #1a1a2e;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 30px auto 0;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(224, 192, 104, 0.4);
        }
        
        .result-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
        }
        
        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-title {
            color: #e0c068;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(224, 192, 104, 0.3);
            padding-bottom: 15px;
        }
        
        .bazi-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .bazi-column {
            text-align: center;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .bazi-label {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 10px;
        }
        
        .heavenly-stem {
            font-size: 1.8rem;
            color: #e0c068;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .earthly-branch {
            font-size: 1.5rem;
            color: #7fb3d5;
            font-weight: bold;
        }
        
        .gua-section {
            margin-top: 30px;
        }
        
        .gua-title {
            color: #e0c068;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }
        
        .gua-name {
            font-size: 2rem;
            color: #e0c068;
            text-align: center;
            margin: 20px 0;
        }
        
        .gua-symbol {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 30px 0;
        }
        
        .gua-line {
            display: flex;
            gap: 5px;
        }
        
        .yao {
            width: 80px;
            height: 10px;
            background: #e0c068;
        }
        
        .yao.broken {
            background: transparent;
            position: relative;
        }
        
        .yao.broken::before,
        .yao.broken::after {
            content: '';
            position: absolute;
            width: 35px;
            height: 10px;
            background: #e0c068;
            top: 0;
        }
        
        .yao.broken::before {
            left: 0;
        }
        
        .yao.broken::after {
            right: 0;
        }
        
        .interpretation {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .interpretation h3 {
            color: #e0c068;
            margin-bottom: 10px;
        }
        
        .interpretation p {
            margin-bottom: 15px;
            line-height: 1.8;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .bazi-display {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .input-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>八字解读</h1>
            <p class="subtitle">输入生辰八字，结合周易八卦进行解卦</p>
        </header>
        
        <div class="form-section">
            <form id="baziForm">
                <div class="form-group">
                    <label>基本信息</label>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="gender">性别</label>
                            <select id="gender" required>
                                <option value="">请选择性别</option>
                                <option value="male">男</option>
                                <option value="female">女</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>出生信息</label>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="year">年份</label>
                            <select id="year" required>
                                <option value="">请选择年份</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="month">月份</label>
                            <select id="month" required>
                                <option value="">请选择月份</option>
                                <option value="1">一月</option>
                                <option value="2">二月</option>
                                <option value="3">三月</option>
                                <option value="4">四月</option>
                                <option value="5">五月</option>
                                <option value="6">六月</option>
                                <option value="7">七月</option>
                                <option value="8">八月</option>
                                <option value="9">九月</option>
                                <option value="10">十月</option>
                                <option value="11">十一月</option>
                                <option value="12">十二月</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="day">日期</label>
                            <select id="day" required>
                                <option value="">请选择日期</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="hour">时辰</label>
                            <select id="hour" required>
                                <option value="">请选择时辰</option>
                                <option value="23">子时 (23:00-01:00)</option>
                                <option value="1">丑时 (01:00-03:00)</option>
                                <option value="3">寅时 (03:00-05:00)</option>
                                <option value="5">卯时 (05:00-07:00)</option>
                                <option value="7">辰时 (07:00-09:00)</option>
                                <option value="9">巳时 (09:00-11:00)</option>
                                <option value="11">午时 (11:00-13:00)</option>
                                <option value="13">未时 (13:00-15:00)</option>
                                <option value="15">申时 (15:00-17:00)</option>
                                <option value="17">酉时 (17:00-19:00)</option>
                                <option value="19">戌时 (19:00-21:00)</option>
                                <option value="21">亥时 (21:00-23:00)</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn">开始解卦</button>
            </form>
        </div>
        
        <div class="result-section" id="resultSection">
            <h2 class="result-title">解卦结果</h2>
            
            <div id="baziResult">
                <h3 class="gua-title">生辰八字</h3>
                <div class="bazi-display" id="baziDisplay">
                </div>
            </div>
            
            <div class="gua-section">
                <h3 class="gua-title">周易卦象</h3>
                <div class="gua-name" id="guaName"></div>
                <div class="gua-symbol" id="guaSymbol"></div>
                <div class="interpretation" id="guaInterpretation">
                </div>
            </div>
            
            <div class="ziwei-section" id="ziweiSection" style="display: none;">
                <h3 class="gua-title">紫微斗数命盘</h3>
                
                <div class="interpretation" id="ziweiPrinciple">
                </div>
                
                <div class="mingpan-summary" id="mingpanSummary">
                </div>
                
                <div class="interpretation" id="ziweiInterpretation">
                </div>
            </div>
        </div>
    </div>

    <script>
        const heavenlyStems = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
        const earthlyBranches = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
        
        const solarTerms2024 = {
            'lichun': { month: 2, day: 4, hour: 16, minute: 26 },
            'jingzhe': { month: 3, day: 5, hour: 10, minute: 22 },
            'qingming': { month: 4, day: 4, hour: 14, minute: 2 },
            'lixia': { month: 5, day: 5, hour: 8, minute: 9 },
            'mangzhong': { month: 6, day: 5, hour: 12, minute: 9 },
            'xiaoshu': { month: 7, day: 6, hour: 22, minute: 20 },
            'liqiu': { month: 8, day: 7, hour: 12, minute: 9 },
            'bailu': { month: 9, day: 7, hour: 0, minute: 11 },
            'hanlu': { month: 10, day: 8, hour: 5, minute: 12 },
            'lidong': { month: 11, day: 7, hour: 8, minute: 3 },
            'daxue': { month: 12, day: 6, hour: 23, minute: 17 },
            'xiaohan2025': { month: 1, day: 5, hour: 17, minute: 49 },
            'lichun2025': { month: 2, day: 3, hour: 22, minute: 10 }
        };
        
        const solarTerms2025 = {
            'lichun': { month: 2, day: 3, hour: 22, minute: 10 },
            'jingzhe': { month: 3, day: 5, hour: 16, minute: 12 },
            'qingming': { month: 4, day: 4, hour: 20, minute: 13 },
            'lixia': { month: 5, day: 5, hour: 13, minute: 53 },
            'mangzhong': { month: 6, day: 5, hour: 17, minute: 59 },
            'xiaoshu': { month: 7, day: 7, hour: 4, minute: 6 },
            'liqiu': { month: 8, day: 7, hour: 17, minute: 51 },
            'bailu': { month: 9, day: 7, hour: 5, minute: 52 },
            'hanlu': { month: 10, day: 8, hour: 11, minute: 1 },
            'lidong': { month: 11, day: 7, hour: 13, minute: 48 },
            'daxue': { month: 12, day: 7, hour: 5, minute: 5 },
            'xiaohan2026': { month: 1, day: 5, hour: 23, minute: 32 },
            'lichun2026': { month: 2, day: 4, hour: 4, minute: 28 }
        };
        
        const solarTerms2026 = {
            'lichun': { month: 2, day: 4, hour: 4, minute: 28 },
            'jingzhe': { month: 3, day: 5, hour: 22, minute: 5 },
            'qingming': { month: 4, day: 5, hour: 2, minute: 0 },
            'lixia': { month: 5, day: 5, hour: 19, minute: 32 },
            'mangzhong': { month: 6, day: 5, hour: 23, minute: 44 },
            'xiaoshu': { month: 7, day: 7, hour: 9, minute: 52 },
            'liqiu': { month: 8, day: 7, hour: 23, minute: 40 },
            'bailu': { month: 9, day: 7, hour: 11, minute: 41 },
            'hanlu': { month: 10, day: 8, hour: 16, minute: 43 },
            'lidong': { month: 11, day: 7, hour: 19, minute: 31 },
            'daxue': { month: 12, day: 7, hour: 10, minute: 52 },
            'xiaohan2027': { month: 1, day: 5, hour: 5, minute: 13 },
            'lichun2027': { month: 2, day: 3, hour: 10, minute: 16 }
        };
        
        function getSolarTermsData(year) {
            if (year === 2024) return solarTerms2024;
            if (year === 2025) return solarTerms2025;
            if (year === 2026) return solarTerms2026;
            
            const baseYear = 2024;
            const yearsDiff = year - baseYear;
            const adjustedTerms = {};
            
            for (const [key, term] of Object.entries(solarTerms2024)) {
                if (key === 'xiaohan2025' || key === 'lichun2025') continue;
                adjustedTerms[key] = {
                    month: term.month,
                    day: term.day,
                    hour: (term.hour + yearsDiff * 6) % 24,
                    minute: term.minute
                };
            }
            return adjustedTerms;
        }
        
        function isAfterSolarTerm(year, month, day, hour, term) {
            if (month > term.month) return true;
            if (month < term.month) return false;
            if (day > term.day) return true;
            if (day < term.day) return false;
            if (hour > term.hour) return true;
            if (hour < term.hour) return false;
            return true;
        }
        
        function getYearStemBranch(year, month, day, hour) {
            const terms = getSolarTermsData(year);
            let actualYear = year;
            
            if (terms.lichun) {
                if (!isAfterSolarTerm(year, month, day, hour, terms.lichun)) {
                    actualYear = year - 1;
                }
            }
            
            const stemIndex = (actualYear - 4) % 10;
            const branchIndex = (actualYear - 4) % 12;
            
            return {
                stem: heavenlyStems[stemIndex],
                branch: earthlyBranches[branchIndex]
            };
        }
        
        function getMonthStemBranch(year, month, day, hour, yearStem) {
            const terms = getSolarTermsData(year);
            const prevTerms = getSolarTermsData(year - 1);
            
            let monthBranchIndex = 0;
            
            const lichun = terms.lichun || { month: 2, day: 4, hour: 0, minute: 0 };
            const jingzhe = terms.jingzhe || { month: 3, day: 5, hour: 0, minute: 0 };
            const qingming = terms.qingming || { month: 4, day: 4, hour: 0, minute: 0 };
            const lixia = terms.lixia || { month: 5, day: 5, hour: 0, minute: 0 };
            const mangzhong = terms.mangzhong || { month: 6, day: 5, hour: 0, minute: 0 };
            const xiaoshu = terms.xiaoshu || { month: 7, day: 6, hour: 0, minute: 0 };
            const liqiu = terms.liqiu || { month: 8, day: 7, hour: 0, minute: 0 };
            const bailu = terms.bailu || { month: 9, day: 7, hour: 0, minute: 0 };
            const hanlu = terms.hanlu || { month: 10, day: 8, hour: 0, minute: 0 };
            const lidong = terms.lidong || { month: 11, day: 7, hour: 0, minute: 0 };
            const daxue = terms.daxue || { month: 12, day: 6, hour: 0, minute: 0 };
            const xiaohan = terms.xiaohan2025 || { month: 1, day: 5, hour: 0, minute: 0 };
            
            if (isAfterSolarTerm(year, month, day, hour, daxue)) {
                monthBranchIndex = 0;
            } else if (isAfterSolarTerm(year, month, day, hour, lidong)) {
                monthBranchIndex = 11;
            } else if (isAfterSolarTerm(year, month, day, hour, hanlu)) {
                monthBranchIndex = 10;
            } else if (isAfterSolarTerm(year, month, day, hour, bailu)) {
                monthBranchIndex = 9;
            } else if (isAfterSolarTerm(year, month, day, hour, liqiu)) {
                monthBranchIndex = 8;
            } else if (isAfterSolarTerm(year, month, day, hour, xiaoshu)) {
                monthBranchIndex = 7;
            } else if (isAfterSolarTerm(year, month, day, hour, mangzhong)) {
                monthBranchIndex = 6;
            } else if (isAfterSolarTerm(year, month, day, hour, lixia)) {
                monthBranchIndex = 5;
            } else if (isAfterSolarTerm(year, month, day, hour, qingming)) {
                monthBranchIndex = 4;
            } else if (isAfterSolarTerm(year, month, day, hour, jingzhe)) {
                monthBranchIndex = 3;
            } else if (isAfterSolarTerm(year, month, day, hour, lichun)) {
                monthBranchIndex = 2;
            } else {
                monthBranchIndex = 1;
            }
            
            const yearStemIndex = heavenlyStems.indexOf(yearStem);
            
            let monthStemBase;
            if (yearStemIndex === 0 || yearStemIndex === 5) {
                monthStemBase = 2;
            } else if (yearStemIndex === 1 || yearStemIndex === 6) {
                monthStemBase = 4;
            } else if (yearStemIndex === 2 || yearStemIndex === 7) {
                monthStemBase = 6;
            } else if (yearStemIndex === 3 || yearStemIndex === 8) {
                monthStemBase = 8;
            } else {
                monthStemBase = 0;
            }
            
            let monthOffset = (monthBranchIndex - 2 + 12) % 12;
            let monthStemIndex = (monthStemBase + monthOffset) % 10;
            
            return {
                stem: heavenlyStems[monthStemIndex],
                branch: earthlyBranches[monthBranchIndex]
            };
        }
        
        function getDayStemBranch(year, month, day, hour) {
            let actualDay = day;
            let actualMonth = month;
            let actualYear = year;
            
            if (hour >= 23) {
                actualDay++;
            }
            
            if (actualDay > 31) {
                actualDay = 1;
                actualMonth++;
                if (actualMonth > 12) {
                    actualMonth = 1;
                    actualYear++;
                }
            }
            
            let A = actualYear;
            let is2000Later = actualYear >= 2000;
            
            if (is2000Later) {
                A = actualYear - 2000;
            } else {
                A = actualYear - 1900;
            }
            
            let base;
            if (is2000Later) {
                base = (A + 7) * 5 + 15 + Math.floor((A + 19) / 4);
            } else {
                base = (A + 3) * 5 + 55 + Math.floor((A - 1) / 4);
            }
            
            let dayOfYear = 0;
            const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            
            const isLeap = (actualYear % 4 === 0 && actualYear % 100 !== 0) || (actualYear % 400 === 0);
            if (isLeap) monthDays[1] = 29;
            
            for (let i = 0; i < actualMonth - 1; i++) {
                dayOfYear += monthDays[i];
            }
            dayOfYear += actualDay;
            
            let total = (base + dayOfYear) % 60;
            if (total === 0) total = 60;
            
            const stemIndex = (total - 1) % 10;
            const branchIndex = (total - 1) % 12;
            
            return {
                stem: heavenlyStems[stemIndex],
                branch: earthlyBranches[branchIndex]
            };
        }
        
        function getHourStemBranch(dayStem, hour) {
            let hourBranchIndex;
            if (hour >= 23 || hour < 1) {
                hourBranchIndex = 0;
            } else if (hour >= 1 && hour < 3) {
                hourBranchIndex = 1;
            } else if (hour >= 3 && hour < 5) {
                hourBranchIndex = 2;
            } else if (hour >= 5 && hour < 7) {
                hourBranchIndex = 3;
            } else if (hour >= 7 && hour < 9) {
                hourBranchIndex = 4;
            } else if (hour >= 9 && hour < 11) {
                hourBranchIndex = 5;
            } else if (hour >= 11 && hour < 13) {
                hourBranchIndex = 6;
            } else if (hour >= 13 && hour < 15) {
                hourBranchIndex = 7;
            } else if (hour >= 15 && hour < 17) {
                hourBranchIndex = 8;
            } else if (hour >= 17 && hour < 19) {
                hourBranchIndex = 9;
            } else if (hour >= 19 && hour < 21) {
                hourBranchIndex = 10;
            } else {
                hourBranchIndex = 11;
            }
            
            const dayStemIndex = heavenlyStems.indexOf(dayStem);
            let hourStemBase;
            
            if (dayStemIndex === 0 || dayStemIndex === 5) {
                hourStemBase = 0;
            } else if (dayStemIndex === 1 || dayStemIndex === 6) {
                hourStemBase = 2;
            } else if (dayStemIndex === 2 || dayStemIndex === 7) {
                hourStemBase = 4;
            } else if (dayStemIndex === 3 || dayStemIndex === 8) {
                hourStemBase = 6;
            } else {
                hourStemBase = 8;
            }
            
            let hourStemIndex = (hourStemBase + hourBranchIndex) % 10;
            
            return {
                stem: heavenlyStems[hourStemIndex],
                branch: earthlyBranches[hourBranchIndex]
            };
        }
        
        const bagua = {
            qian: { name: '乾', symbol: [1, 1, 1], element: '天', meaning: '刚健、创造、领导' },
            dui: { name: '兑', symbol: [1, 1, 0], element: '泽', meaning: '喜悦、交流、和谐' },
            li: { name: '离', symbol: [1, 0, 1], element: '火', meaning: '光明、依附、美丽' },
            zhen: { name: '震', symbol: [1, 0, 0], element: '雷', meaning: '震动、奋起、行动' },
            xun: { name: '巽', symbol: [0, 1, 1], element: '风', meaning: '顺从、进入、灵活' },
            kan: { name: '坎', symbol: [0, 1, 0], element: '水', meaning: '危险、困境、智慧' },
            gen: { name: '艮', symbol: [0, 0, 1], element: '山', meaning: '停止、静止、稳重' },
            kun: { name: '坤', symbol: [0, 0, 0], element: '地', meaning: '柔顺、包容、承载' }
        };

        function initYearSelect() {
            const yearSelect = document.getElementById('year');
            const currentYear = new Date().getFullYear();
            
            for (let year = currentYear; year >= 1920; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + '年';
                yearSelect.appendChild(option);
            }
        }
        
        function initDaySelect() {
            const daySelect = document.getElementById('day');

                const option = document.createElement('option');
                option.value = day;
                option.textContent = day + '日';
                daySelect.appendChild(option);
            }
        }

            for (let i = 0; i < 4; i++) {

                column.appendChild(label);
                column.appendChild(stem);
                column.appendChild(branch);
                baziDisplay.appendChild(column);
            }
        }

            let mingGongIndex = (monthPos - hourBranchIndex + 12) % 12;

            };
